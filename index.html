<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adel dance studio — Запис на занятия</title>
  
  <!-- Подключаем библиотеки Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #fdf6f8;
      --card-bg: #ffffff;
      --accent-pink: #f4c2c2;
      --accent-pink-hover: #eaa9a9;
      --accent-dark-pink: #d87093;
      --text-dark: #2c2c2c;
      --text-muted: #7d7d7d;
      --border-color: #f0dbe0;
      --shadow: 0 10px 30px rgba(220, 160, 175, 0.15);
      --radius: 16px;
      --danger-color: #e74c3c;
      --danger-hover: #c0392b;
      --disabled-color: #bdc3c7;
      --top-bar-bg: #fbf0f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      max-height: 100%;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 25px;
      background: var(--top-bar-bg);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 15px;
      flex-shrink: 0;
    }

    .brand-header-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(216, 112, 147, 0.12);
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2001;
    }

    .logo-btn.hidden-by-modal {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .logo-btn:hover {
      background: #fff;
      border-color: var(--accent-dark-pink);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(216, 112, 147, 0.25);
    }

    .logo-btn:active {
      transform: translateY(0);
    }

    .logo-btn img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-dark-pink);
      letter-spacing: 0.5px;
    }

    .clock-container {
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 600;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 30px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .user-profile-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
    }

    .user-input-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .user-input {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      flex: 1;
    }

    .btn-small {
      padding: 8px 16px;
      background: var(--accent-dark-pink);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-small:hover {
      opacity: 0.9;
    }

    .btn-cancel {
      background: var(--danger-color);
    }

    .btn-cancel:hover {
      background: var(--danger-hover);
    }

    .btn-disabled {
      background: var(--disabled-color);
      cursor: not-allowed;
      opacity: 0.8;
    }

    .btn-change-name {
      background: var(--top-bar-bg);
      color: var(--accent-dark-pink);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-change-name:hover {
      background: var(--accent-pink);
      color: white;
    }

    /* Макет */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .calendar-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .my-bookings-section {
      width: 320px;
      border-left: 1px solid var(--border-color);
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .my-bookings-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-dark-pink);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .booking-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .booking-info-date {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    .booking-info-time {
      font-size: 0.85rem;
      color: var(--accent-dark-pink);
      font-weight: 600;
    }

    .no-bookings-msg {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      margin-top: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px 10px;
      flex-shrink: 0;
    }

    .month-display {
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .nav-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-dark);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: var(--accent-pink);
      color: white;
    }

    .calendar-body {
      padding: 0 30px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-card {
      aspect-ratio: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .day-card:not(.sunday):not(.empty):hover {
      background: var(--accent-pink);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 194, 194, 0.5);
    }

    .day-card.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .day-card.today {
      border: 2px solid var(--accent-dark-pink);
      font-weight: 700;
      background: #fff;
    }

    .day-card.past {
      background: #f5ecef;
      color: #a89a9e;
      opacity: 0.65;
    }

    .day-card.past:hover {
      background: #edd8de;
      color: var(--text-dark);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(220, 160, 175, 0.2);
    }

    .day-card.sunday {
      background: #f7f7f7;
      border-color: #eee;
      color: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .weekday-sunday {
      color: #e74c3c;
      opacity: 0.6;
    }

    .today-btn {
      position: fixed;
      bottom: 40px;
      right: 25px;
      width: 50px;
      height: 50px;
      background-color: var(--accent-dark-pink);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(216, 112, 147, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.2s ease, visibility 0.3s;
      z-index: 900;
    }

    .today-btn:hover {
      transform: translateY(-3px) scale(1.05);
      background-color: #c45d80;
    }

    .today-btn.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius);
      width: 90%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }

    .modal-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .time-slots {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .slot-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      background: var(--bg-color);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .slot-time {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .participants-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    .participants-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .participant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 4px;
      border: 1px solid #f2e3e6;
    }

    .participant-item.is-me {
      font-weight: 600;
      color: var(--accent-dark-pink);
      border-color: var(--accent-pink);
    }

    .no-participants {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Модальное окно просмотра логотипа и Instagram */
    .logo-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 20px;
    }

    .logo-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .logo-card-modal {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      position: relative;
      text-align: center;
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .logo-overlay-img {
      max-width: 180px;
      max-height: 180px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(216, 112, 147, 0.25));
      margin-bottom: 15px;
    }

    .studio-modal-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 18px;
    }

    .instagram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(220, 39, 67, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .instagram-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.5);
    }

    .instagram-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Адаптив под смартфоны */
    @media (max-width: 768px) {
      body {
        padding: 5px;
      }

      .app-container {
        border-radius: 12px;
        height: 100%;
      }

      .top-bar {
        padding: 8px 10px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .brand-title {
        font-size: 0.95rem;
      }

      .logo-btn {
        width: 36px;
        height: 36px;
      }

      .clock-container {
        font-size: 0.7rem;
        padding: 4px 6px;
      }

      .user-bar {
        padding: 8px 10px;
      }

      .main-layout {
        flex-direction: column;
        overflow-y: auto;
      }

      .calendar-section {
        flex: 0 0 auto;
      }

      .calendar-header {
        padding: 10px 10px 6px;
      }

      .month-display {
        font-size: 1.15rem;
      }

      .nav-btn {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }

      .calendar-body {
        padding: 0 8px 8px;
        flex: 0 0 auto;
        border-bottom: 1px solid var(--border-color);
      }

      .my-bookings-section {
        width: 100%;
        border-left: none;
        padding: 12px 10px;
        flex: 1;
        background: var(--top-bar-bg);
      }

      .days-grid {
        gap: 4px;
      }

      .day-card {
        font-size: 0.85rem;
        border-radius: 8px;
      }

      .today-btn {
        bottom: 42px;
        right: 12px;
        width: 42px;
        height: 42px;
        font-size: 0.95rem;
      }

      .modal-overlay {
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        width: 92%;
        max-width: 400px;
        border-radius: var(--radius);
        padding: 20px 15px;
        max-height: 80vh;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <div class="brand-header-group">
      <button class="logo-btn" id="logo-button" title="Інформація про студію">
        <img src="ADS-ikon.png" alt="ADS Logo">
      </button>
      <span class="brand-title">Adel dance studio</span>
    </div>
    
    <div class="clock-container" id="clock">00:00:00 | 00.00.0000</div>
  </div>

  <div class="user-bar">
    <div id="user-anonymous" class="user-input-group">
      <input type="text" id="user-name-input" class="user-input" placeholder="Введіть ваше ім'я">
      <button class="btn-small" onclick="saveUser()">Зберегти</button>
    </div>
    <div id="user-logged" class="user-profile-info" style="display: none;">

  <div class="main-layout">

        <div class="days-grid" id="days-container"></div>
      </div>
    </div>

    <div class="my-bookings-section">
      <div class="my-bookings-title">
        📌 Ваші записи
      </div>
      <div id="my-bookings-container">
        <div class="no-bookings-msg">Завантаження...</div>
      </div>
    </div>
  </div>
</div>

<button id="today-btn" class="today-btn hidden" title="Повернутися до сьогоднішнього дня">
  <span id="today-btn-day"></span>
</button>

<div class="modal-overlay" id="booking-modal">
  <div class="modal-content">
    <span class="close-btn" id="close-modal">&times;</span>
    <h3 class="modal-title" id="modal-date-title">Запис на дату</h3>
    <p class="modal-subtitle" id="modal-date-subtitle">Оберіть час та запишіться:</p>
    <div class="time-slots" id="time-slots-container"></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBVDvOEPjiVOqqMQoQmyh4bPdNCLlS1Ups",
    authDomain: "kozmin-a1.firebaseapp.com",
    databaseURL: "https://kozmin-a1-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "kozmin-a1",
    storageBucket: "kozmin-a1.firebasestorage.app",
    messagingSenderId: "875753095435",
    appId: "1:875753095435:web:9792b0565bc2a34ebae20e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();

    document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} | ${day}.${month}.${year}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  let currentUser = localStorage.getItem('adel_user') || '';

  function initUser() {
    const anonBlock = document.getElementById('user-anonymous');
    const loggedBlock = document.getElementById('user-logged');
    const nameDisplay = document.getElementById('display-user-name');

    if (currentUser) {
      anonBlock.style.display = 'none';
      loggedBlock.style.display = 'flex';
      nameDisplay.textContent = currentUser;
    } else {
      anonBlock.style.display = 'flex';
      loggedBlock.style.display = 'none';
    }
    listenToAllBookings();
  }

  function saveUser() {
    const input = document.getElementById('user-name-input');
    const val = input.value.trim();
    if (!val) {
      alert('Будь ласка, введіть ваше ім\'я!');
      return;
    }
    currentUser = val;
    localStorage.setItem('adel_user', currentUser);
    initUser();
    if (selectedFullDate) renderTimeSlots();
  }

  function logoutUser() {
    localStorage.removeItem('adel_user');
    currentUser = '';
    initUser();
    if (selectedFullDate) renderTimeSlots();
  }

  let currentDate = new Date();
  const realToday = new Date();
  const todayZero = new Date(realToday.getFullYear(), realToday.getMonth(), realToday.getDate());
  
  let selectedFullDate = '';
  let selectedDateObj = null;
  let isPastDate = false;

  const monthDisplay = document.getElementById('month-display');
  const daysContainer = document.getElementById('days-container');
  const prevBtn = document.getElementById('prev-month');
  const nextBtn = document.getElementById('next-month');
  const logoButton = document.getElementById('logo-button');
  
  const todayBtn = document.getElementById('today-btn');
  const todayBtnDay = document.getElementById('today-btn-day');

  todayBtnDay.textContent = realToday.getDate();

  const monthNames = [
    "Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
    "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"
  ];

  function checkTodayButtonVisibility() {
    if (
      currentDate.getMonth() === realToday.getMonth() &&
      currentDate.getFullYear() === realToday.getFullYear()
    ) {
      todayBtn.classList.add('hidden');
    } else {
      todayBtn.classList.remove('hidden');
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthDisplay.textContent = `${monthNames[month]} ${year}`;
    daysContainer.innerHTML = '';

    const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCard = document.createElement('div');
      emptyCard.classList.add('day-card', 'empty');
      daysContainer.appendChild(emptyCard);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayCard = document.createElement('div');
      dayCard.classList.add('day-card');
      dayCard.textContent = day;

      const currentDayDate = new Date(year, month, day);
      const isSunday = currentDayDate.getDay() === 0;
      const isPast = currentDayDate < todayZero;

      if (
        day === realToday.getDate() &&
        month === realToday.getMonth() &&
        year === realToday.getFullYear()
      ) {
        dayCard.classList.add('today');
      } else if (isPast && !isSunday) {
        dayCard.classList.add('past');
      }

      if (isSunday) {
        dayCard.classList.add('sunday');
        dayCard.title = "Неділя — вихідний день";
      } else {
        dayCard.addEventListener('click', () => openBookingModal(day, month, year));
      }

      daysContainer.appendChild(dayCard);
    }

    checkTodayButtonVisibility();
  }

  function resetToToday() {
    currentDate = new Date(realToday.getFullYear(), realToday.getMonth(), 1);
    renderCalendar();
  }

  prevBtn.addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  nextBtn.addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  todayBtn.addEventListener('click', resetToToday);

  /* Показ модального окна логотипа */
  const logoOverlay = document.getElementById('logo-overlay');
  const closeLogoModal = document.getElementById('close-logo-modal');

  logoButton.addEventListener('click', () => {
    logoOverlay.classList.add('active');
  });

  closeLogoModal.addEventListener('click', () => {
    logoOverlay.classList.remove('active');
  });

  logoOverlay.addEventListener('click', (e) => {
    if (e.target === logoOverlay) {
      logoOverlay.classList.remove('active');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && logoOverlay.classList.contains('active')) {
      logoOverlay.classList.remove('active');
    }
  });

  renderCalendar();

  /* Логика для блока "Ваші записи" */
  function listenToAllBookings() {
    const container = document.getElementById('my-bookings-container');
    
    if (!currentUser) {
      container.innerHTML = '<div class="no-bookings-msg">Увійдіть або введіть ім\'я, щоб побачити свої записи</div>';
      return;
    }

    db.ref('bookings').on('value', (snapshot) => {
      const allBookings = snapshot.val() || {};
      const userBookings = [];

      Object.entries(allBookings).forEach(([dateStr, timeSlots]) => {
        const [year, month, day] = dateStr.split('-').map(Number);
        const bookingDateObj = new Date(year, month - 1, day);

        if (bookingDateObj >= todayZero) {
          Object.entries(timeSlots).forEach(([timeKey, participants]) => {
            if (participants) {
              Object.entries(participants).forEach(([id, name]) => {
                if (name === currentUser) {
                  userBookings.push({
                    dateStr,
                    formattedDate: `${String(day).padStart(2, '0')}.${String(month).padStart(2, '0')}.${year}`,
                    time: timeKey.replace('_', ':'),
                    timeKey,
                    id,
                    rawDate: bookingDateObj
                  });
                }
              });
            }
          });
        }
      });

      userBookings.sort((a, b) => a.rawDate - b.rawDate || a.time.localeCompare(b.time));

      if (userBookings.length === 0) {
        container.innerHTML = '<div class="no-bookings-msg">У вас немає активних записів</div>';
        return;
      }

      container.innerHTML = '';
      userBookings.forEach(item => {
        const card = document.createElement('div');
        card.className = 'booking-card';
        card.innerHTML = `
          <div>
            <div class="booking-info-date">${item.formattedDate}</div>
            <div class="booking-info-time">⏰ ${item.time}</div>
          </div>
        `;

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn-small btn-cancel';
        cancelBtn.style.padding = '4px 8px';
        cancelBtn.style.fontSize = '0.75rem';
        cancelBtn.textContent = 'Скасувати';
        cancelBtn.onclick = () => {
          db.ref(`bookings/${item.dateStr}/${item.timeKey}/${item.id}`).remove();
        };

        card.appendChild(cancelBtn);
        container.appendChild(card);
      });
    });
  }

  initUser();

  /* Модальное окно записи */
  const modal = document.getElementById('booking-modal');
  const closeModal = document.getElementById('close-modal');
  const modalDateTitle = document.getElementById('modal-date-title');
  const modalDateSubtitle = document.getElementById('modal-date-subtitle');
  const timeSlotsContainer = document.getElementById('time-slots-container');

  let currentDayBookings = {};

  function getAvailableTimes(dateObj) {
    if (dateObj && dateObj.getDay() === 6) {
      return ["10:00", "11:00"];
    }
    return ["15:00", "16:00", "17:00", "18:00"];
  }

  function openBookingModal(day, month, year) {
    logoButton.classList.add('hidden-by-modal');

    const formattedDay = String(day).padStart(2, '0');
    const formattedMonth = String(month + 1).padStart(2, '0');
    selectedFullDate = `${year}-${formattedMonth}-${formattedDay}`;

    selectedDateObj = new Date(year, month, day);
    isPastDate = selectedDateObj < todayZero;

    modalDateTitle.textContent = `Запис на ${formattedDay}.${formattedMonth}.${year}`;
    if (isPastDate) {
      modalDateSubtitle.textContent = "Перегляд архівної дати (запис закрито):";
    } else {
      modalDateSubtitle.textContent = "Оберіть час та запишіться:";
    }

    modal.style.display = 'flex';

    db.ref('bookings/' + selectedFullDate).on('value', (snapshot) => {
      currentDayBookings = snapshot.val() || {};
      renderTimeSlots();
    });
  }

  function hideModal() {
    modal.style.display = 'none';
    logoButton.classList.remove('hidden-by-modal');
    if (selectedFullDate) db.ref('bookings/' + selectedFullDate).off();
  }

  function renderTimeSlots() {
    timeSlotsContainer.innerHTML = '';
    const timesToDisplay = getAvailableTimes(selectedDateObj);

    timesToDisplay.forEach(time => {
      const timeKey = time.replace(':', '_');
      const participantsObj = currentDayBookings[timeKey] || {};
      const participantsEntries = Object.entries(participantsObj);

      const myRecordEntry = participantsEntries.find(([id, name]) => name === currentUser);
      const isMyBooking = !!myRecordEntry;

      const slotCard = document.createElement('div');
      slotCard.className = 'slot-card';

      const slotHeader = document.createElement('div');
      slotHeader.className = 'slot-header';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'slot-time';
      timeSpan.textContent = time;

      const actionBtn = document.createElement('button');

      if (isPastDate) {
        actionBtn.className = 'btn-small btn-disabled';
        actionBtn.textContent = 'Запис закрито';
        actionBtn.disabled = true;
      } else if (isMyBooking) {
        actionBtn.className = 'btn-small btn-cancel';
        actionBtn.textContent = 'Скасувати запис';
        actionBtn.onclick = () => cancelSlot(timeKey, myRecordEntry[0]);
      } else {
        actionBtn.className = 'btn-small';
        actionBtn.textContent = 'Записатися';
        actionBtn.onclick = () => bookSlot(timeKey);
      }

      slotHeader.appendChild(timeSpan);
      slotHeader.appendChild(actionBtn);
      slotCard.appendChild(slotHeader);

      const partContainer = document.createElement('div');
      partContainer.className = 'participants-list';

      const partTitle = document.createElement('div');
      partTitle.className = 'participants-title';
      partTitle.textContent = `Записалися (${participantsEntries.length}):`;
      partContainer.appendChild(partTitle);

      if (participantsEntries.length === 0) {
        const noPart = document.createElement('div');
        noPart.className = 'no-participants';
        noPart.textContent = 'Поки ніхто не записався';
        partContainer.appendChild(noPart);
      } else {
        participantsEntries.forEach(([id, name]) => {
          const item = document.createElement('div');
          item.className = 'participant-item';
          if (name === currentUser) {
            item.classList.add('is-me');
          }

          const nameSpan = document.createElement('span');
          nameSpan.textContent = name + (name === currentUser ? ' (Ви)' : '');
          item.appendChild(nameSpan);

          partContainer.appendChild(item);
        });
      }

      slotCard.appendChild(partContainer);
      timeSlotsContainer.appendChild(slotCard);
    });
  }

  function bookSlot(timeKey) {
    if (!currentUser) {
      alert('Будь ласка, введіть ваше ім\'я вгорі сторінки перед записом!');
      return;
    }

    if (isPastDate) {
      alert('Неможливо записатися на минулу дату!');
      return;
    }

    const participantsObj = currentDayBookings[timeKey] || {};
    const participants = Object.values(participantsObj);

    if (participants.includes(currentUser)) {
      alert('Ви вже записані на цей час!');
      return;
    }

    db.ref(`bookings/${selectedFullDate}/${timeKey}`).push(currentUser);
  }

  function cancelSlot(timeKey, recordId) {
    if (isPastDate) {
      alert('Неможливо скасувати запис на минулу дату!');
      return;
    }
    db.ref(`bookings/${selectedFullDate}/${timeKey}/${recordId}`).remove();
  }

  closeModal.addEventListener('click', hideModal);

  window.addEventListener('click', (e) => {
    if (e.target === modal) {
      hideModal();
    }
  });
</script>

</body>
</html>
