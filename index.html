<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adel dance studio — Запись на занятия</title>
  
  <!-- Подключаем библиотеки Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #fdf6f8;
      --card-bg: #ffffff;
      --accent-pink: #f4c2c2;
      --accent-pink-hover: #eaa9a9;
      --accent-dark-pink: #d87093;
      --text-dark: #2c2c2c;
      --text-muted: #7d7d7d;
      --border-color: #f0dbe0;
      --shadow: 0 10px 30px rgba(220, 160, 175, 0.15);
      --radius: 16px;
      --danger-color: #e74c3c;
      --danger-hover: #c0392b;
      --disabled-color: #bdc3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Блокируем скролл всего экрана */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh; /* Учитывает динамические панели браузеров на iOS/Android */
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      max-height: 100%;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 25px;
      background: #fbf0f3;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 15px;
      flex-shrink: 0;
    }

    /* Левый блок: Кнопка с логотипом + Текстовое название */
    .brand-header-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Кнопка с логотипом слева */
    .logo-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(216, 112, 147, 0.12);
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2001; /* Позволяет кликать по кнопке поверх логотипа */
    }

    .logo-btn.hidden-by-modal {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .logo-btn:hover {
      background: #fff;
      border-color: var(--accent-dark-pink);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(216, 112, 147, 0.25);
    }

    .logo-btn:active {
      transform: translateY(0);
    }

    .logo-btn img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-dark-pink);
      letter-spacing: 0.5px;
    }

    .clock-container {
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 600;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
    }

    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 30px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .user-profile-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
    }

    .user-input-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .user-input {
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
      flex: 1;
    }

    .btn-small {
      padding: 8px 16px;
      background: var(--accent-dark-pink);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-small:hover {
      opacity: 0.9;
    }

    .btn-cancel {
      background: var(--danger-color);
    }

    .btn-cancel:hover {
      background: var(--danger-hover);
    }

    .btn-disabled {
      background: var(--disabled-color);
      cursor: not-allowed;
      opacity: 0.8;
    }

    .btn-change-name {
      background: #fbf0f3;
      color: var(--accent-dark-pink);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-change-name:hover {
      background: var(--accent-pink);
      color: white;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px 10px;
      flex-shrink: 0;
    }

    .month-display {
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .nav-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--text-dark);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      background: var(--accent-pink);
      color: white;
    }

    .calendar-body {
      padding: 0 30px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
    }

    .weekdays-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-card {
      aspect-ratio: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .day-card:not(.sunday):not(.empty):hover {
      background: var(--accent-pink);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 194, 194, 0.5);
    }

    .day-card.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .day-card.today {
      border: 2px solid var(--accent-dark-pink);
      font-weight: 700;
      background: #fff;
    }

    /* Выключенное воскресенье */
    .day-card.sunday {
      background: #f7f7f7;
      border-color: #eee;
      color: #ccc;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .weekday-sunday {
      color: #e74c3c;
      opacity: 0.6;
    }

    /* Плавающая кнопка возврата к текущей дате */
    .today-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 50px;
      height: 50px;
      background-color: var(--accent-dark-pink);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(216, 112, 147, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.2s ease, visibility 0.3s;
      z-index: 900;
    }

    .today-btn:hover {
      transform: translateY(-3px) scale(1.05);
      background-color: #c45d80;
    }

    .today-btn.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Модальное окно записи */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: var(--radius);
      width: 90%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 5px;
    }

    .modal-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .time-slots {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .slot-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      background: var(--bg-color);
    }

    .slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .slot-time {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .participants-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    .participants-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .participant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 4px;
      border: 1px solid #f2e3e6;
    }

    .participant-item.is-me {
      font-weight: 600;
      color: var(--accent-dark-pink);
      border-color: var(--accent-pink);
    }

    .no-participants {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Полу-прозрачный оверлей с логотипом */
    .logo-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .logo-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .logo-overlay-img {
      max-width: 75vw;
      max-height: 75vh;
      object-fit: contain;
      opacity: 0.85; /* Полупрозрачность логотипа */
      filter: drop-shadow(0 10px 25px rgba(216, 112, 147, 0.3));
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease;
    }

    .logo-overlay-img:hover {
      transform: scale(1.02);
    }

    /* Адаптивные стили под мобильные телефоны */
    @media (max-width: 600px) {
      body {
        padding: 5px;
      }

      .app-container {
        border-radius: 12px;
        height: 100%;
      }

      .top-bar {
        padding: 8px 10px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }

      .brand-title {
        font-size: 0.95rem;
      }

      .logo-btn {
        width: 36px;
        height: 36px;
      }

      .clock-container {
        font-size: 0.7rem;
        padding: 4px 6px;
      }

      .user-bar {
        padding: 8px 10px;
      }

      .calendar-header {
        padding: 10px 10px 6px;
      }

      .month-display {
        font-size: 1.15rem;
      }

      .nav-btn {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }

      .calendar-body {
        padding: 0 8px 10px;
      }

      .days-grid {
        gap: 4px;
      }

      .day-card {
        font-size: 0.85rem;
        border-radius: 8px;
      }

      .today-btn {
        bottom: 12px;
        right: 12px;
        width: 42px;
        height: 42px;
        font-size: 0.95rem;
      }

      /* Окно записи строго по центру экрана */
      .modal-overlay {
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        width: 92%;
        max-width: 400px;
        border-radius: var(--radius);
        padding: 20px 15px;
        max-height: 80vh;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="top-bar">
    <!-- Левый блок с кнопкой-логотипом и названием -->
    <div class="brand-header-group">
      <button class="logo-btn" id="logo-button" title="Переключить показ логотипа">
        <img src="ADS-ikon.png" alt="ADS Logo">
      </button>
      <span class="brand-title">Adel dance studio</span>
    </div>
    
    <div class="clock-container" id="clock">00:00:00 | 00.00.0000</div>
  </div>

  <div class="user-bar">
    <div id="user-anonymous" class="user-input-group">
      <input type="text" id="user-name-input" class="user-input" placeholder="Введите ваше имя">
      <button class="btn-small" onclick="saveUser()">Сохранить</button>
    </div>
    <div id="user-logged" class="user-profile-info" style="display: none;">
      <span>Привет, <strong id="display-user-name"></strong>!</span>
      <button class="btn-change-name" onclick="logoutUser()">Сменить имя</button>
    </div>
  </div>

  <div class="calendar-header">
    <button class="nav-btn" id="prev-month">‹</button>
    <div class="month-display" id="month-display">Месяц Год</div>
    <button class="nav-btn" id="next-month">›</button>
  </div>

  <div class="calendar-body">
    <div class="weekdays-grid">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div class="weekday-sunday">Вс</div>
    </div>
    <div class="days-grid" id="days-container"></div>
  </div>
</div>

<!-- Плавающая кнопка возврата к текущей дате -->
<button id="today-btn" class="today-btn hidden" title="Вернуться к сегодняшнему дню">
  <span id="today-btn-day"></span>
</button>

<!-- Модальное окно записи -->
<div class="modal-overlay" id="booking-modal">
  <div class="modal-content">
    <span class="close-btn" id="close-modal">&times;</span>
    <h3 class="modal-title" id="modal-date-title">Запись на дату</h3>
    <p class="modal-subtitle" id="modal-date-subtitle">Выберите время и запишитесь:</p>
    <div class="time-slots" id="time-slots-container"></div>
  </div>
</div>

<!-- Полу-прозрачное всплывающее изображение логотипа -->
<div class="logo-overlay" id="logo-overlay">
  <img src="ADS-ikon.png" alt="ADS Logo Large" class="logo-overlay-img" id="logo-overlay-img" title="Кликните, чтобы закрыть">
</div>

<script>
  // Конфигурация Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBVDvOEPjiVOqqMQoQmyh4bPdNCLlS1Ups",
    authDomain: "kozmin-a1.firebaseapp.com",
    databaseURL: "https://kozmin-a1-default-rtdb.europe-west1.firebasedatabase.app/",
    projectId: "kozmin-a1",
    storageBucket: "kozmin-a1.firebasestorage.app",
    messagingSenderId: "875753095435",
    appId: "1:875753095435:web:9792b0565bc2a34ebae20e"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Часы
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();

    document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} | ${day}.${month}.${year}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Имя пользователя
  let currentUser = localStorage.getItem('adel_user') || '';

  function initUser() {
    const anonBlock = document.getElementById('user-anonymous');
    const loggedBlock = document.getElementById('user-logged');
    const nameDisplay = document.getElementById('display-user-name');

    if (currentUser) {
      anonBlock.style.display = 'none';
      loggedBlock.style.display = 'flex';
      nameDisplay.textContent = currentUser;
    } else {
      anonBlock.style.display = 'flex';
      loggedBlock.style.display = 'none';
    }
  }

  function saveUser() {
    const input = document.getElementById('user-name-input');
    const val = input.value.trim();
    if (!val) {
      alert('Пожалуйста, введите ваше имя!');
      return;
    }
    currentUser = val;
    localStorage.setItem('adel_user', currentUser);
    initUser();
    if (selectedFullDate) renderTimeSlots();
  }

  function logoutUser() {
    localStorage.removeItem('adel_user');
    currentUser = '';
    initUser();
    if (selectedFullDate) renderTimeSlots();
  }

  initUser();

  // Календарь
  let currentDate = new Date();
  const realToday = new Date();
  
  let selectedFullDate = '';
  let isPastDate = false;

  const monthDisplay = document.getElementById('month-display');
  const daysContainer = document.getElementById('days-container');
  const prevBtn = document.getElementById('prev-month');
  const nextBtn = document.getElementById('next-month');
  const logoButton = document.getElementById('logo-button');
  
  const todayBtn = document.getElementById('today-btn');
  const todayBtnDay = document.getElementById('today-btn-day');

  todayBtnDay.textContent = realToday.getDate();

  const monthNames = [
    "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
  ];

  function checkTodayButtonVisibility() {
    if (
      currentDate.getMonth() === realToday.getMonth() &&
      currentDate.getFullYear() === realToday.getFullYear()
    ) {
      todayBtn.classList.add('hidden');
    } else {
      todayBtn.classList.remove('hidden');
    }
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthDisplay.textContent = `${monthNames[month]} ${year}`;
    daysContainer.innerHTML = '';

    const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
    const totalDays = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCard = document.createElement('div');
      emptyCard.classList.add('day-card', 'empty');
      daysContainer.appendChild(emptyCard);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dayCard = document.createElement('div');
      dayCard.classList.add('day-card');
      dayCard.textContent = day;

      const currentDayDate = new Date(year, month, day);
      const isSunday = currentDayDate.getDay() === 0;

      if (
        day === realToday.getDate() &&
        month === realToday.getMonth() &&
        year === realToday.getFullYear()
      ) {
        dayCard.classList.add('today');
      }

      if (isSunday) {
        dayCard.classList.add('sunday');
        dayCard.title = "Воскресенье — выходной день";
      } else {
        dayCard.addEventListener('click', () => openBookingModal(day, month, year));
      }

      daysContainer.appendChild(dayCard);
    }

    checkTodayButtonVisibility();
  }

  function resetToToday() {
    currentDate = new Date(realToday.getFullYear(), realToday.getMonth(), 1);
    renderCalendar();
  }

  prevBtn.addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });

  nextBtn.addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  todayBtn.addEventListener('click', resetToToday);

  // Переключение показа/скрытия логотипа по нажатию кнопки
  const logoOverlay = document.getElementById('logo-overlay');

  logoButton.addEventListener('click', () => {
    logoOverlay.classList.toggle('active');
  });

  // Закрытие при клике по оверлею или по самому изображению
  logoOverlay.addEventListener('click', () => {
    logoOverlay.classList.remove('active');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && logoOverlay.classList.contains('active')) {
      logoOverlay.classList.remove('active');
    }
  });

  renderCalendar();

  // Модальное окно записи через Firebase
  const modal = document.getElementById('booking-modal');
  const closeModal = document.getElementById('close-modal');
  const modalDateTitle = document.getElementById('modal-date-title');
  const modalDateSubtitle = document.getElementById('modal-date-subtitle');
  const timeSlotsContainer = document.getElementById('time-slots-container');

  const availableTimes = ["15:00", "16:00", "17:00", "18:00"];
  let currentDayBookings = {};

  function openBookingModal(day, month, year) {
    // Скрываем логотип-кнопку при вызове окна записи
    logoButton.classList.add('hidden-by-modal');

    const formattedDay = String(day).padStart(2, '0');
    const formattedMonth = String(month + 1).padStart(2, '0');
    selectedFullDate = `${year}-${formattedMonth}-${formattedDay}`;

    const selectedDateObj = new Date(year, month, day);
    const todayZero = new Date(realToday.getFullYear(), realToday.getMonth(), realToday.getDate());

    isPastDate = selectedDateObj < todayZero;

    modalDateTitle.textContent = `Запись на ${formattedDay}.${formattedMonth}.${year}`;
    if (isPastDate) {
      modalDateSubtitle.textContent = "Просмотр архивной даты (запись закрыта):";
    } else {
      modalDateSubtitle.textContent = "Выберите время и запишитесь:";
    }

    modal.style.display = 'flex';

    db.ref('bookings/' + selectedFullDate).on('value', (snapshot) => {
      currentDayBookings = snapshot.val() || {};
      renderTimeSlots();
    });
  }

  function hideModal() {
    modal.style.display = 'none';
    // Возвращаем видимость кнопки логотипа
    logoButton.classList.remove('hidden-by-modal');
    if (selectedFullDate) db.ref('bookings/' + selectedFullDate).off();
  }

  function renderTimeSlots() {
    timeSlotsContainer.innerHTML = '';

    availableTimes.forEach(time => {
      const timeKey = time.replace(':', '_');
      const participantsObj = currentDayBookings[timeKey] || {};
      const participantsEntries = Object.entries(participantsObj);

      const myRecordEntry = participantsEntries.find(([id, name]) => name === currentUser);
      const isMyBooking = !!myRecordEntry;

      const slotCard = document.createElement('div');
      slotCard.className = 'slot-card';

      const slotHeader = document.createElement('div');
      slotHeader.className = 'slot-header';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'slot-time';
      timeSpan.textContent = time;

      const actionBtn = document.createElement('button');

      if (isPastDate) {
        actionBtn.className = 'btn-small btn-disabled';
        actionBtn.textContent = 'Запись закрыта';
        actionBtn.disabled = true;
      } else if (isMyBooking) {
        actionBtn.className = 'btn-small btn-cancel';
        actionBtn.textContent = 'Отменить запись';
        actionBtn.onclick = () => cancelSlot(timeKey, myRecordEntry[0]);
      } else {
        actionBtn.className = 'btn-small';
        actionBtn.textContent = 'Записаться';
        actionBtn.onclick = () => bookSlot(timeKey);
      }

      slotHeader.appendChild(timeSpan);
      slotHeader.appendChild(actionBtn);
      slotCard.appendChild(slotHeader);

      const partContainer = document.createElement('div');
      partContainer.className = 'participants-list';

      const partTitle = document.createElement('div');
      partTitle.className = 'participants-title';
      partTitle.textContent = `Записались (${participantsEntries.length}):`;
      partContainer.appendChild(partTitle);

      if (participantsEntries.length === 0) {
        const noPart = document.createElement('div');
        noPart.className = 'no-participants';
        noPart.textContent = 'Пока никто не записался';
        partContainer.appendChild(noPart);
      } else {
        participantsEntries.forEach(([id, name]) => {
          const item = document.createElement('div');
          item.className = 'participant-item';
          if (name === currentUser) {
            item.classList.add('is-me');
          }

          const nameSpan = document.createElement('span');
          nameSpan.textContent = name + (name === currentUser ? ' (Вы)' : '');
          item.appendChild(nameSpan);

          partContainer.appendChild(item);
        });
      }

      slotCard.appendChild(partContainer);
      timeSlotsContainer.appendChild(slotCard);
    });
  }

  function bookSlot(timeKey) {
    if (!currentUser) {
      alert('Пожалуйста, введите ваше имя вверху страницы перед записью!');
      return;
    }

    if (isPastDate) {
      alert('Нельзя записаться на прошедшую дату!');
      return;
    }

    const participantsObj = currentDayBookings[timeKey] || {};
    const participants = Object.values(participantsObj);

    if (participants.includes(currentUser)) {
      alert('Вы уже записаны на это время!');
      return;
    }

    db.ref(`bookings/${selectedFullDate}/${timeKey}`).push(currentUser);
  }

  function cancelSlot(timeKey, recordId) {
    if (isPastDate) {
      alert('Нельзя отменить запись на прошедшую дату!');
      return;
    }
    db.ref(`bookings/${selectedFullDate}/${timeKey}/${recordId}`).remove();
  }

  closeModal.addEventListener('click', hideModal);

  window.addEventListener('click', (e) => {
    if (e.target === modal) {
      hideModal();
    }
  });
</script>

</body>
</html>
